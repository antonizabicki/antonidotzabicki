<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Antoni Żabicki</title>
  <meta name="description" content="Antoni Żabicki — creative, musician, videographer, graphic designer, artist." />
  <meta name="theme-color" content="#0a0908" />
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0908'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-weight='700' font-size='34' letter-spacing='-1.5' fill='%23ff7e00'%3EA%C5%BB%3C/text%3E%3C/svg%3E"
  />
  <link rel="preload" as="image" href="antonizabickioverlay.png" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --brand-orange: #ff7e00;
      --cursor-arrow: url("cursor-arrow.png") 2 2, auto;
      --cursor-arrow-2x: -webkit-image-set(url("cursor-arrow.png") 1x, url("cursor-arrow@2x.png") 2x) 2 2, auto;
      --cursor-pointer: url("cursor-hand.png") 10 2, pointer;
      --cursor-pointer-2x: -webkit-image-set(url("cursor-hand.png") 1x, url("cursor-hand@2x.png") 2x) 10 2, pointer;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a0908;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 700;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-user-select: none;
      cursor: var(--cursor-arrow);
      cursor: var(--cursor-arrow-2x);
    }

    a, button, [role="button"] {
      cursor: var(--cursor-pointer);
      cursor: var(--cursor-pointer-2x);
    }

    /* Main fullscreen stage */
    .stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #0a0908;
    }

    /* Hidden media sources drawn into the interactive scene canvas */
    .hidden-source {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }

    /* Wrapper that receives the Right-Click SVG Fluid Displacement Filter */
    .distort-target {
      position: absolute;
      inset: -28px;
      width: calc(100% + 56px);
      height: calc(100% + 56px);
      will-change: filter;
    }

    /* Main interactive scene canvas (renders video + dim + overlay with 60fps Left-Click Mesh Liquify) */
    .scene-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      display: block;
    }

    /* Single-line lowercase Helvetica Bold Footer in exact overlay orange (#ff7e00), no shadow, separated by lines */
    .site-footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 24px;
      z-index: 8;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 1.8vw, 26px);
      padding: 0 28px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: clamp(10.5px, 0.88vw, 13px);
      letter-spacing: 0.04em;
      line-height: 1;
      text-transform: lowercase;
      color: var(--brand-orange);
      text-align: center;
      text-shadow: none;
      animation: footerFadeIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
    }

    .footer-item {
      position: relative;
      color: var(--brand-orange);
      text-decoration: none;
      white-space: nowrap;
      text-shadow: none;
      transition: opacity 0.2s ease;
    }

    .footer-item:hover {
      opacity: 0.75;
    }

    /* Horizontal orange connecting lines matching the overlay style */
    .footer-line {
      display: inline-block;
      width: clamp(28px, 5vw, 84px);
      height: 1.5px;
      background-color: var(--brand-orange);
      flex-shrink: 0;
    }

    /* High-motion fine grain on top */
    .grain-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 7;
      pointer-events: none;
      opacity: 0.24;
      mix-blend-mode: overlay;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Hidden SVG filter definitions */
    .svg-defs {
      position: absolute;
      width: 0;
      height: 0;
      pointer-events: none;
      overflow: hidden;
    }

    @keyframes footerFadeIn {
      0% {
        opacity: 0;
        transform: translateY(6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .site-footer {
        bottom: 16px;
        flex-wrap: wrap;
        font-size: 9.5px;
        gap: 8px 10px;
        padding: 0 14px;
      }
      .footer-line {
        width: 18px;
      }
    }
  </style>
</head>
<body>
  <!-- Right-Click Organic Fluid SVG Filter (exact version from earlier) -->
  <svg class="svg-defs" aria-hidden="true">
    <defs>
      <filter
        id="fluidDistort"
        x="-6%"
        y="-6%"
        width="112%"
        height="112%"
        color-interpolation-filters="sRGB"
      >
        <feImage
          id="dispFeImage"
          x="0"
          y="0"
          width="100%"
          height="100%"
          preserveAspectRatio="none"
          result="rawMap"
        />
        <feGaussianBlur in="rawMap" stdDeviation="5.5" result="smoothMap" />
        <feDisplacementMap
          id="dispMapMain"
          in="SourceGraphic"
          in2="smoothMap"
          scale="0"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </defs>
  </svg>

  <video
    id="bgVideo"

    muted

  >

  <img
    id="overlayImg"
    src="antonizabickioverlay.png"
    alt="I Am Antoni Żabicki — creative, musician, videographer, graphic designer, artist"
    class="hidden-source"
    draggable="false"
  />

  <main class="stage" id="stage">
    <div class="distort-target" id="distortTarget">
      <canvas id="sceneCanvas" class="scene-canvas"></canvas>
    </div>

    <footer class="site-footer" id="siteFooter">
      <a href="mailto:quei@what-is-next.vip" class="footer-item">contact: quei@what-is-next.vip</a>
      <span class="footer-line" aria-hidden="true"></span>
      <a
        href="https://www.instagram.com/antoni.zabicki/"
        target="_blank"
        rel="noopener noreferrer"
        class="footer-item"
      >ig: antoni.zabicki</a>
      <span class="footer-line" aria-hidden="true"></span>
      <a
        href="https://witrynaodzera.pl"
        target="_blank"
        rel="noopener noreferrer"
        class="footer-item"
      >©2026 witrynaodzera™</a>
      <span class="footer-line" aria-hidden="true"></span>
      <a
        href="https://what-is-next.vip"
        target="_blank"
        rel="noopener noreferrer"
        class="footer-item"
      >powered by what-is-next™</a>
    </footer>

    <canvas id="grainCanvas" class="grain-canvas" aria-hidden="true"></canvas>
  </main>

  <script>
    // 1. Left-Click Smooth 2D Mesh Liquify on sceneCanvas (100% glitch-free)
    (() => {
      const video = document.getElementById('bgVideo');
      const overlayImg = document.getElementById('overlayImg');
      const sceneCanvas = document.getElementById('sceneCanvas');
      const ctx = sceneCanvas.getContext('2d', { alpha: false });

      const posterImg = new Image();
      posterImg.src = 'poster.jpg';

      const offCanvas = document.createElement('canvas');
      const offCtx = offCanvas.getContext('2d', { alpha: false });

      let vw = window.innerWidth;
      let vh = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 1.75);
      let cw = 0;
      let ch = 0;

      const COLS = 56;
      const ROWS = 36;
      const NUM_VERTS = (COLS + 1) * (ROWS + 1);

      const lx = new Float32Array(NUM_VERTS);
      const ly = new Float32Array(NUM_VERTS);
      const tmpX = new Float32Array(NUM_VERTS);
      const tmpY = new Float32Array(NUM_VERTS);

      function resizeScene() {
        const rect = sceneCanvas.getBoundingClientRect();
        vw = rect.width || window.innerWidth || 1;
        vh = rect.height || window.innerHeight || 1;
        dpr = Math.min(window.devicePixelRatio || 1, 1.75);
        cw = Math.max(1, Math.ceil(vw * dpr));
        ch = Math.max(1, Math.ceil(vh * dpr));
        sceneCanvas.width = cw;
        sceneCanvas.height = ch;
        offCanvas.width = cw;
        offCanvas.height = ch;
      }

      window.addEventListener('resize', resizeScene, { passive: true });
      resizeScene();

      if (video) {
        video.muted = true;
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            window.addEventListener('pointerdown', () => video.play(), { once: true });
          });
        }
      }

      // Left-Click Drag -> Smooth Forward-Warp Liquify
      function applyLiquifySegment(x0, y0, x1, y1) {
        // Offset by the -28px padding of .distort-target
        const ox0 = x0 + 28;
        const oy0 = y0 + 28;
        const ox1 = x1 + 28;
        const oy1 = y1 + 28;

        const dxScreen = ox1 - ox0;
        const dyScreen = oy1 - oy0;
        const dist = Math.hypot(dxScreen, dyScreen);
        if (dist < 0.1) return;

        const steps = Math.max(1, Math.ceil(dist / 6));
        const brushRadius = Math.max(95, Math.min(vw, vh) * 0.16);
        const r2Max = brushRadius * brushRadius;

        const stepDx = (dxScreen / steps) * 0.85;
        const stepDy = (dyScreen / steps) * 0.85;

        const cellW = vw / COLS;
        const cellH = vh / ROWS;

        for (let s = 0; s < steps; s++) {
          const t = (s + 1) / steps;
          const px = ox0 + dxScreen * t;
          const py = oy0 + dyScreen * t;

          const minI = Math.max(1, Math.floor((px - brushRadius) / cellW));
          const maxI = Math.min(COLS - 1, Math.ceil((px + brushRadius) / cellW));
          const minJ = Math.max(1, Math.floor((py - brushRadius) / cellH));
          const maxJ = Math.min(ROWS - 1, Math.ceil((py + brushRadius) / cellH));

          for (let j = minJ; j <= maxJ; j++) {
            const vyPos = j * cellH;
            const dy = vyPos - py;
            const row = j * (COLS + 1);
            for (let i = minI; i <= maxI; i++) {
              const vxPos = i * cellW;
              const dx = vxPos - px;
              const d2 = dx * dx + dy * dy;
              if (d2 < r2Max) {
                const q = 1 - d2 / r2Max;
                const w = q * q * (3 - 2 * q);
                const idx = row + i;
                lx[idx] += stepDx * w;
                ly[idx] += stepDy * w;

                const mag = Math.hypot(lx[idx], ly[idx]);
                const maxStretch = brushRadius * 0.72;
                if (mag > maxStretch) {
                  const scale = maxStretch / mag;
                  lx[idx] *= scale;
                  ly[idx] *= scale;
                }
              }
            }
          }
        }
      }

      window.__applyLiquifySegment = applyLiquifySegment;

      let isLeftDragging = false;
      let lastX = 0;
      let lastY = 0;

      window.addEventListener('pointerdown', (e) => {
        if (e.button === 0) {
          isLeftDragging = true;
          lastX = e.clientX;
          lastY = e.clientY;
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (isLeftDragging && (e.buttons & 1) === 1) {
          applyLiquifySegment(lastX, lastY, e.clientX, e.clientY);
          lastX = e.clientX;
          lastY = e.clientY;
        } else {
          isLeftDragging = false;
        }
      }, { passive: true });

      window.addEventListener('pointerup', () => {
        isLeftDragging = false;
      });

      function diffuseMesh(srcX, srcY, dstX, dstY, visc) {
        const inv = 1 - visc;
        const q = visc * 0.25;
        const stride = COLS + 1;
        for (let j = 1; j < ROWS; j++) {
          const row = j * stride;
          for (let i = 1; i < COLS; i++) {
            const idx = row + i;
            dstX[idx] =
              srcX[idx] * inv +
              (srcX[idx - 1] + srcX[idx + 1] + srcX[idx - stride] + srcX[idx + stride]) * q;
            dstY[idx] =
              srcY[idx] * inv +
              (srcY[idx - 1] + srcY[idx + 1] + srcY[idx - stride] + srcY[idx + stride]) * q;
          }
        }
      }

      function drawTexturedTriangle(
        u0, v0, u1, v1, u2, v2,
        x0, y0, x1, y1, x2, y2
      ) {
        const cx = (x0 + x1 + x2) / 3;
        const cy = (y0 + y1 + y2) / 3;
        const d0 = Math.hypot(x0 - cx, y0 - cy) || 1;
        const d1 = Math.hypot(x1 - cx, y1 - cy) || 1;
        const d2 = Math.hypot(x2 - cx, y2 - cy) || 1;
        const pad = 0.85;

        const px0 = x0 + ((x0 - cx) / d0) * pad;
        const py0 = y0 + ((y0 - cy) / d0) * pad;
        const px1 = x1 + ((x1 - cx) / d1) * pad;
        const py1 = y1 + ((y1 - cy) / d1) * pad;
        const px2 = x2 + ((x2 - cx) / d2) * pad;
        const py2 = y2 + ((y2 - cy) / d2) * pad;

        const du1 = u1 - u0;
        const dv1 = v1 - v0;
        const du2 = u2 - u0;
        const dv2 = v2 - v0;
        const det = du1 * dv2 - du2 * dv1;
        if (Math.abs(det) < 1e-5) return;
        const invDet = 1 / det;

        const dx1 = x1 - x0;
        const dy1 = y1 - y0;
        const dx2 = x2 - x0;
        const dy2 = y2 - y0;

        const a = (dx1 * dv2 - dx2 * dv1) * invDet;
        const b = (dy1 * dv2 - dy2 * dv1) * invDet;
        const c = (dx2 * du1 - dx1 * du2) * invDet;
        const d = (dy2 * du1 - dy1 * du2) * invDet;
        const e = x0 - a * u0 - c * v0;
        const f = y0 - b * u0 - d * v0;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(px0, py0);
        ctx.lineTo(px1, py1);
        ctx.lineTo(px2, py2);
        ctx.closePath();
        ctx.clip();
        ctx.setTransform(a, b, c, d, e, f);
        ctx.drawImage(offCanvas, 0, 0);
        ctx.restore();
      }

      function renderCompositeScene() {
        const vSource =
          video && video.readyState >= 2 && video.videoWidth > 0
            ? video
            : posterImg.complete && posterImg.naturalWidth > 0
            ? posterImg
            : null;

        if (vSource) {
          const sw = vSource.videoWidth || vSource.naturalWidth;
          const sh = vSource.videoHeight || vSource.naturalHeight;
          if (sw && sh) {
            const scale = Math.max(cw / sw, ch / sh);
            const dw = sw * scale;
            const dh = sh * scale;
            const dx = (cw - dw) * 0.5;
            const dy = (ch - dh) * 0.5;
            offCtx.drawImage(vSource, dx, dy, dw, dh);
          }
        } else {
          offCtx.fillStyle = '#0a0908';
          offCtx.fillRect(0, 0, cw, ch);
        }

        // Flat subtle darkening (no vignette)
        offCtx.fillStyle = 'rgba(8, 7, 6, 0.22)';
        offCtx.fillRect(0, 0, cw, ch);

        if (overlayImg && overlayImg.complete && overlayImg.naturalWidth > 0) {
          const screenVw = window.innerWidth || vw;
          const targetCssW =
            screenVw <= 768
              ? Math.max(280, Math.min(screenVw * 0.84, 460))
              : Math.max(320, Math.min(screenVw * 0.49, 720));
          const ow = targetCssW * dpr;
          const oh = ow * (overlayImg.naturalHeight / overlayImg.naturalWidth);
          const ox = (cw - ow) * 0.5;
          const oy = (ch - oh) * 0.5;

          offCtx.save();
          offCtx.shadowColor = 'rgba(0, 0, 0, 0.42)';
          offCtx.shadowBlur = 22 * dpr;
          offCtx.shadowOffsetY = 5 * dpr;
          offCtx.drawImage(overlayImg, ox, oy, ow, oh);
          offCtx.restore();
        }
      }

      function animate() {
        renderCompositeScene();

        const stride = COLS + 1;
        diffuseMesh(lx, ly, tmpX, tmpY, 0.22);
        diffuseMesh(tmpX, tmpY, lx, ly, 0.22);

        let maxDisp = 0;
        for (let j = 1; j < ROWS; j++) {
          const row = j * stride;
          for (let i = 1; i < COLS; i++) {
            const idx = row + i;
            lx[idx] *= 0.968;
            ly[idx] *= 0.968;
            const d = Math.abs(lx[idx]) + Math.abs(ly[idx]);
            if (d > maxDisp) maxDisp = d;
          }
        }

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.drawImage(offCanvas, 0, 0);

        if (maxDisp > 0.15) {
          const cellCw = cw / COLS;
          const cellCh = ch / ROWS;

          for (let j = 0; j < ROWS; j++) {
            const row0 = j * stride;
            const row1 = (j + 1) * stride;
            const v0 = j * cellCh;
            const v1 = (j + 1) * cellCh;

            for (let i = 0; i < COLS; i++) {
              const i00 = row0 + i;
              const i10 = row0 + i + 1;
              const i01 = row1 + i;
              const i11 = row1 + i + 1;

              const dx00 = lx[i00], dy00 = ly[i00];
              const dx10 = lx[i10], dy10 = ly[i10];
              const dx01 = lx[i01], dy01 = ly[i01];
              const dx11 = lx[i11], dy11 = ly[i11];

              const cellEnergy =
                Math.abs(dx00) + Math.abs(dy00) +
                Math.abs(dx10) + Math.abs(dy10) +
                Math.abs(dx01) + Math.abs(dy01) +
                Math.abs(dx11) + Math.abs(dy11);

              if (cellEnergy < 0.25) continue;

              const u0 = i * cellCw;
              const u1 = (i + 1) * cellCw;

              const x00 = u0 + dx00 * dpr;
              const y00 = v0 + dy00 * dpr;
              const x10 = u1 + dx10 * dpr;
              const y10 = v0 + dy10 * dpr;
              const x01 = u0 + dx01 * dpr;
              const y01 = v1 + dy01 * dpr;
              const x11 = u1 + dx11 * dpr;
              const y11 = v1 + dy11 * dpr;

              drawTexturedTriangle(
                u0, v0, u1, v0, u0, v1,
                x00, y00, x10, y10, x01, y01
              );
              drawTexturedTriangle(
                u1, v0, u1, v1, u0, v1,
                x10, y10, x11, y11, x01, y01
              );
            }
          }
        }

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    })();

    // 2. Right-Click Organic Fluid Splash Engine (Restored exact 3-harmonic SVG feDisplacementMap fluid!)
    (() => {
      const distortTarget = document.getElementById('distortTarget');
      const dispFeImage = document.getElementById('dispFeImage');
      const dispMapMain = document.getElementById('dispMapMain');

      const GRID_W = 144;
      const GRID_H = 90;
      const N = GRID_W * GRID_H;

      const ux = new Float32Array(N);
      const uy = new Float32Array(N);
      const vx = new Float32Array(N);
      const vy = new Float32Array(N);
      const tmpX = new Float32Array(N);
      const tmpY = new Float32Array(N);

      const dispCanvas = document.createElement('canvas');
      dispCanvas.width = GRID_W;
      dispCanvas.height = GRID_H;
      const dCtx = dispCanvas.getContext('2d');
      const imgData = dCtx.createImageData(GRID_W, GRID_H);
      const pix = imgData.data;

      for (let i = 0; i < pix.length; i += 4) {
        pix[i] = 128;
        pix[i + 1] = 128;
        pix[i + 2] = 128;
        pix[i + 3] = 255;
      }

      const activeSplashes = [];
      let simActive = false;
      let filterApplied = false;

      function spawnRandomFluidSplash(screenX, screenY, power = 1.0) {
        const vw = window.innerWidth || 1;
        const vh = window.innerHeight || 1;

        // Exact 3-harmonic random organic generator from earlier
        const k1 = 2 + ((Math.random() * 2) | 0);        // 2 or 3 primary lobes
        const k2 = 4 + ((Math.random() * 3) | 0);        // 4..6 secondary lobes
        const k3 = 7 + ((Math.random() * 4) | 0);        // 7..10 fine organic ripples
        const p1 = Math.random() * Math.PI * 2;
        const p2 = Math.random() * Math.PI * 2;
        const p3 = Math.random() * Math.PI * 2;
        const a1 = 0.22 + Math.random() * 0.22;
        const a2 = 0.14 + Math.random() * 0.18;
        const a3 = 0.08 + Math.random() * 0.12;
        const swirl = (Math.random() - 0.5) * 1.15;      // random vortex twist
        const aspect = 0.78 + Math.random() * 0.44;      // random elliptical anisotropy
        const rotAngle = Math.random() * Math.PI * 2;

        activeSplashes.push({
          gx: (screenX / vw) * GRID_W,
          gy: (screenY / vh) * GRID_H,
          birth: performance.now(),
          duration: 920 + Math.random() * 320,
          maxR: GRID_W * (0.22 + Math.random() * 0.09) * power,
          power,
          k1, k2, k3,
          p1, p2, p3,
          a1, a2, a3,
          swirl,
          aspect,
          cosA: Math.cos(rotAngle),
          sinA: Math.sin(rotAngle),
        });

        if (!simActive) {
          simActive = true;
          requestAnimationFrame(stepRightFluid);
        }
      }

      window.__spawnFluidSplash = spawnRandomFluidSplash;

      window.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        spawnRandomFluidSplash(e.clientX, e.clientY, 1.0);
      });

      function stepRightFluid(now) {
        for (let s = activeSplashes.length - 1; s >= 0; s--) {
          const sp = activeSplashes[s];
          const age = now - sp.birth;
          if (age >= sp.duration) {
            activeSplashes.splice(s, 1);
            continue;
          }

          const t = age / sp.duration;
          const fade = Math.pow(1 - t, 1.55) * sp.power;
          const baseR = 2.5 + Math.pow(t, 0.65) * sp.maxR;
          const band = 5.5 + t * 4.5;
          const bound = Math.ceil((baseR + band) * 1.65);

          const minX = Math.max(1, Math.floor(sp.gx - bound));
          const maxX = Math.min(GRID_W - 2, Math.ceil(sp.gx + bound));
          const minY = Math.max(1, Math.floor(sp.gy - bound));
          const maxY = Math.min(GRID_H - 2, Math.ceil(sp.gy + bound));

          for (let j = minY; j <= maxY; j++) {
            const rawDy = j - sp.gy;
            for (let i = minX; i <= maxX; i++) {
              const rawDx = i - sp.gx;

              const rx = (rawDx * sp.cosA + rawDy * sp.sinA) * sp.aspect;
              const ry = (-rawDx * sp.sinA + rawDy * sp.cosA) / sp.aspect;
              const dist = Math.hypot(rx, ry) || 0.001;
              const theta = Math.atan2(ry, rx);

              const shapeMod =
                1 +
                sp.a1 * Math.sin(sp.k1 * theta + sp.p1 + t * 2.2) +
                sp.a2 * Math.cos(sp.k2 * theta + sp.p2 - t * 3.1) +
                sp.a3 * Math.sin(sp.k3 * theta + sp.p3 + t * 4.5);

              const localR = baseR * shapeMod;
              const delta = dist - localR;

              if (Math.abs(delta) < band) {
                const u = delta / band;
                const env = Math.cos(u * Math.PI * 0.5);
                const wave = Math.sin(u * Math.PI * 2.0) * env * env;
                const force = wave * fade * 2.6;

                const trueDist = Math.hypot(rawDx, rawDy) || 1;
                const nx = rawDx / trueDist;
                const ny = rawDy / trueDist;
                const fx = (nx - ny * sp.swirl * 0.45) * force;
                const fy = (ny + nx * sp.swirl * 0.45) * force;

                const idx = j * GRID_W + i;
                vx[idx] += fx;
                vy[idx] += fy;
              }
            }
          }
        }

        const visc = 0.22;
        const invVisc = 1 - visc;
        for (let j = 1; j < GRID_H - 1; j++) {
          const row = j * GRID_W;
          for (let i = 1; i < GRID_W - 1; i++) {
            const idx = row + i;
            tmpX[idx] =
              ux[idx] * invVisc +
              (ux[idx - 1] + ux[idx + 1] + ux[idx - GRID_W] + ux[idx + GRID_W]) * (visc * 0.25);
            tmpY[idx] =
              uy[idx] * invVisc +
              (uy[idx - 1] + uy[idx + 1] + uy[idx - GRID_W] + uy[idx + GRID_W]) * (visc * 0.25);
          }
        }

        let maxEnergy = 0;
        const springK = 0.048;
        const damping = 0.90;

        for (let j = 1; j < GRID_H - 1; j++) {
          const row = j * GRID_W;
          for (let i = 1; i < GRID_W - 1; i++) {
            const idx = row + i;
            let dx = tmpX[idx] + vx[idx];
            let dy = tmpY[idx] + vy[idx];

            vx[idx] = (vx[idx] - dx * springK) * damping;
            vy[idx] = (vy[idx] - dy * springK) * damping;

            dx *= 0.965;
            dy *= 0.965;

            ux[idx] = dx;
            uy[idx] = dy;

            const e = Math.abs(dx) + Math.abs(dy) + Math.abs(vx[idx]) + Math.abs(vy[idx]);
            if (e > maxEnergy) maxEnergy = e;

            const pIdx = idx * 4;
            pix[pIdx] = Math.max(0, Math.min(255, (128 - dx * 14.5) | 0));
            pix[pIdx + 1] = Math.max(0, Math.min(255, (128 - dy * 14.5) | 0));
          }
        }

        if (maxEnergy < 0.015 && activeSplashes.length === 0) {
          ux.fill(0);
          uy.fill(0);
          vx.fill(0);
          vy.fill(0);
          if (filterApplied) {
            dispMapMain.setAttribute('scale', '0');
            distortTarget.style.filter = 'none';
            filterApplied = false;
          }
          simActive = false;
          return;
        }

        if (!filterApplied) {
          distortTarget.style.filter = 'url(#fluidDistort)';
          dispMapMain.setAttribute('scale', '135');
          filterApplied = true;
        }

        dCtx.putImageData(imgData, 0, 0);
        dispFeImage.setAttribute('href', dispCanvas.toDataURL());

        requestAnimationFrame(stepRightFluid);
      }
    })();

    // 3. Ultra-fine, rapid 60fps film grain ("małe ziarna, dużo ruchu, więcej graina")
    (() => {
      const canvas = document.getElementById('grainCanvas');
      const ctx = canvas.getContext('2d', { alpha: true });

      const TILE_SIZE = 256;
      const NUM_TILES = 18;
      const tiles = [];

      for (let t = 0; t < NUM_TILES; t++) {
        const off = document.createElement('canvas');
        off.width = TILE_SIZE;
        off.height = TILE_SIZE;
        const offCtx = off.getContext('2d');
        const imgData = offCtx.createImageData(TILE_SIZE, TILE_SIZE);
        const data = new Uint32Array(imgData.data.buffer);

        for (let i = 0; i < data.length; i++) {
          const r = Math.random();
          const v = r < 0.5
            ? (Math.pow(r * 2, 0.75) * 128) | 0
            : (128 + Math.pow((r - 0.5) * 2, 0.75) * 127) | 0;
          data[i] = (255 << 24) | (v << 16) | (v << 8) | v;
        }
        offCtx.putImageData(imgData, 0, 0);
        tiles.push(off);
      }

      let width = 0;
      let height = 0;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = Math.ceil(window.innerWidth * dpr);
        height = Math.ceil(window.innerHeight * dpr);
        canvas.width = width;
        canvas.height = height;
        ctx.imageSmoothingEnabled = false;
      }

      window.addEventListener('resize', resize, { passive: true });
      resize();

      let lastTile = 0;
      function renderGrain() {
        let nextTile = (Math.random() * NUM_TILES) | 0;
        if (nextTile === lastTile) nextTile = (nextTile + 1) % NUM_TILES;
        lastTile = nextTile;

        const tile = tiles[nextTile];
        const ox = -((Math.random() * TILE_SIZE) | 0);
        const oy = -((Math.random() * TILE_SIZE) | 0);

        for (let y = oy; y < height; y += TILE_SIZE) {
          for (let x = ox; x < width; x += TILE_SIZE) {
            ctx.drawImage(tile, x, y);
          }
        }

        requestAnimationFrame(renderGrain);
      }

      requestAnimationFrame(renderGrain);
    })();
  </script>
